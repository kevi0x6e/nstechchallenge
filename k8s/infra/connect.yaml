# Kafka Connect with the Debezium PostgreSQL connector. JSON without embedded schemas keeps
# payloads small; the worker relies on a fixed, documented subset of the envelope (docs/spec.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: connect
  labels: { app: connect }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: connect }
  template:
    metadata:
      labels: { app: connect }
    spec:
      enableServiceLinks: false
      containers:
        - name: connect
          image: quay.io/debezium/connect:3.3.1.Final
          env:
            - { name: BOOTSTRAP_SERVERS, value: "kafka:9092" }
            - { name: GROUP_ID, value: "fleet-connect" }
            - { name: CONFIG_STORAGE_TOPIC, value: "connect_configs" }
            - { name: OFFSET_STORAGE_TOPIC, value: "connect_offsets" }
            - { name: STATUS_STORAGE_TOPIC, value: "connect_statuses" }
            - { name: CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR, value: "1" }
            - { name: CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR, value: "1" }
            - { name: CONNECT_STATUS_STORAGE_REPLICATION_FACTOR, value: "1" }
            - { name: KEY_CONVERTER, value: "org.apache.kafka.connect.json.JsonConverter" }
            - { name: VALUE_CONVERTER, value: "org.apache.kafka.connect.json.JsonConverter" }
            - { name: CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE, value: "false" }
            - { name: CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE, value: "false" }
            - { name: HEAP_OPTS, value: "-Xms256m -Xmx512m" }
          ports: [{ containerPort: 8083 }]
          readinessProbe:
            httpGet: { path: /connectors, port: 8083 }
            periodSeconds: 3
          resources:
            requests: { memory: 512Mi, cpu: 200m }
            limits: { memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: connect
spec:
  selector: { app: connect }
  ports: [{ port: 8083 }]
